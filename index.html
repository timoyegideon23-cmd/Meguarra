<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meguarra Farm · Inkoroshoni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2E6; --card:#FFFFFF; --ink:#1B2A20; --muted:#52614F; --line:#D3DCC6;
  --green:#2F5A3A; --gold:#E9A93A; --deep:#0F1F18;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111A14;--card:#1A261E;--ink:#EDF1E4;--muted:#A9B8A2;--line:#2C3B30;--green:#8FC49A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111A14;--card:#1A261E;--ink:#EDF1E4;--muted:#A9B8A2;--line:#2C3B30;--green:#8FC49A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.7 "Figtree",system-ui,sans-serif}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.25rem}

/* Hero */
.hero{position:relative;min-height:100svh;min-height:100vh;overflow:hidden;color:#fff;background:linear-gradient(#142B3A 0%,#2C5A62 38%,#D98A4A 72%,#F2C66B 100%);display:flex;flex-direction:column}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.25rem;max-width:1040px;width:100%;margin:0 auto}
.logo{font:800 1.25rem "Fraunces",serif;text-decoration:none;letter-spacing:.01em}
nav{display:flex;gap:1.2rem;font-weight:500;font-size:.95rem}
nav a{text-decoration:none;opacity:.92}
nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
@media(max-width:560px){nav a:nth-child(-n+2){display:none}}
.heroText{position:relative;z-index:2;max-width:1040px;width:100%;margin:0 auto;padding:clamp(1.5rem,7vh,4rem) 1.25rem 0}
.place{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);padding:.3rem .9rem;border-radius:999px;font-size:.92rem;margin-bottom:1.2rem}
h1{font-size:clamp(3rem,10vw,6.4rem);font-weight:800;letter-spacing:-.035em;max-width:11ch}
.sub{max-width:30rem;font-size:1.2rem;margin:1.2rem 0 1.8rem;color:#FFF4DD}
.btn{display:inline-block;padding:.9rem 1.5rem;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid transparent;font-size:1rem;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:#1B1A12}
.btn.ghost{border-color:rgba(255,255,255,.7);color:#fff;margin-left:.4rem}
.btn:hover{filter:brightness(1.08)}
.sun{transform-origin:600px 470px;animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(110px);opacity:.2}to{transform:none;opacity:1}}

/* Sections */
section{padding:4.5rem 0}
h2{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.02em;font-weight:600;margin-bottom:1rem}
.lead{max-width:38rem;color:var(--muted);font-size:1.12rem}
.story{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start}
@media(max-width:760px){.story{grid-template-columns:1fr;gap:1.8rem}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.3rem}
.stat b{display:block;font:800 2.4rem/1 "Fraunces",serif;color:var(--green)}
.stat span{color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.3rem;margin-top:2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.6rem}
.card h3{font-size:1.4rem;margin-bottom:.5rem}
.card p{margin:0;color:var(--muted)}
.ico{width:48px;height:48px;border-radius:14px;background:var(--green);display:grid;place-items:center;margin-bottom:1rem}
.ico svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.band{background:var(--deep);color:#EDF1E4}
.band .lead{color:#B9C7B2}
.day{list-style:none;margin:2.2rem 0 0;padding:0;border-left:2px solid rgba(233,169,58,.5)}
.day li{position:relative;padding:0 0 1.6rem 1.6rem}
.day li::before{content:"";position:absolute;left:-8px;top:.5rem;width:14px;height:14px;border-radius:50%;background:var(--gold)}
.day time{font:600 1.15rem "Fraunces",serif;color:var(--gold);display:block}
.day span{color:#C9D6C2}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
@media(max-width:760px){.visit{grid-template-columns:1fr;gap:2rem}}
dt{font-weight:700;margin-top:1rem}dd{margin:0;color:var(--muted)}dl{margin:1.2rem 0 0}
label{display:block;font-weight:700;margin-bottom:1rem;font-size:.95rem}
input,textarea{width:100%;margin-top:.3rem;padding:.8rem .9rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input:focus,textarea:focus{border-color:var(--green)}
form .btn{background:var(--green);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) form .btn{color:#0F1F18}}
footer{background:var(--deep);color:#A9B8A2;text-align:center;padding:2rem 1rem 2.5rem;font-size:.95rem}
footer b{font-family:"Fraunces",serif;color:#EDF1E4;font-size:1.15rem;display:block;margin-bottom:.2rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sun{animation:none}}

.hero{background:#1c1510}
.hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:36% 72%}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(10,16,10,.88) 0%,rgba(10,16,10,.5) 38%,rgba(10,16,10,.12) 65%,rgba(10,16,10,.5) 100%)}
.heroText{margin-top:auto;padding-bottom:clamp(2rem,8vh,4.5rem)}
.hero h1{text-shadow:0 2px 24px rgba(0,0,0,.35)}
</style>
</head>
